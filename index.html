<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahtron Fragancias</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<div class="header">
<img class="logo" src="img/logo.jpg" alt="Logo Ahtron">
<img class="imagen-principal" src="img/NO ES PERFUME.jpg" alt="Imagen principal">
<img class="imagen-esquina" src="img/no 5g.jpg" alt="Imagen 5G">
</div>

<!-- FILTROS -->
<div class="filtros">

<button class="filtro-btn" data-marca="todas">
Todas
</button>

<button class="filtro-btn" data-marca="Afnan">
Afnan
</button>

<button class="filtro-btn" data-marca="Armaf">
Armaf
</button>

<button class="filtro-btn" data-marca="Lattafa">
Lattafa
</button>

<button class="filtro-btn" data-marca="Maison Alhambra">
Maison Alhambra
</button>

</div>


<!-- SELECTOR DE DECANT -->
<div class="decant-opciones">

<h2>Elegí el formato</h2>

<div class="decant-botones">

<button class="decant-btn activo" data-ml="botella">
Botella Completa
</button>

<button class="decant-btn" data-ml="5">
Decant 5 ml
</button>

<button class="decant-btn" data-ml="10">
Decant 10 ml
</button>

</div>

<p class="decant-info">
Seleccioná el formato para ver los precios correspondientes
</p>

</div>


<!-- CATÁLOGO DE PERFUMES -->
<main class="catalogo" id="catalogo">
</main>


<!-- FOOTER -->
<footer>
<p>© 2026 Ahtron Fragancias</p>
</footer>


<script src="script.js"></script>

</body>
</html>
