<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahtron Fragancias</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<div class="header">
<img class="logo" src="img/logo.jpg" alt="Logo Ahtron">
<img class="imagen-principal" src="img/NO ES PERFUME.jpg" alt="Imagen principal">
<img class="imagen-esquina" src="img/no 5g.jpg" alt="Imagen 5G">
</div>

<!-- FILTROS -->
<div class="filtros">
<button data-marca="todas">Todas</button>
<button data-marca="Afnan">Afnan</button>
<button data-marca="Armaf">Armaf</button>
<button data-marca="Lattafa">Lattafa</button>
<button data-marca="Maison Alhambra">Maison Alhambra</button>
</div>

<!-- SELECTOR DECANT -->
<div class="decant-opciones">
<h2>Elegí tu Decant</h2>

<button class="decant-btn" data-ml="botella">
Botella Completa
</button>

<button class="decant-btn" data-ml="5">
Decant 5ml
</button>

<button class="decant-btn" data-ml="10">
Decant 10ml
</button>

<p class="decant-info">
Seleccioná un tamaño para ver los precios correspondientes
</p>
</div>

<!-- CATÁLOGO -->
<main class="catalogo" id="catalogo">
</main>

<!-- FOOTER -->
<footer>
<p>© 2026 Ahtron Fragancias</p>
</footer>

<script src="script.js"></script>

</body>
</html>
